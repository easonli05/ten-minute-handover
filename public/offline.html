<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Ten Minute Handover</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f7f5;
    color: #1c1c1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17171a; color: #efeeec; }
  }
  main { max-width: 320px; text-align: center; }
  h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  p { font-size: 0.9rem; line-height: 1.5; opacity: 0.75; margin: 0 0 1.25rem; }
  button {
    font: inherit;
    border: none;
    border-radius: 999px;
    padding: 0.65rem 1.25rem;
    background: #0f766e;
    color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main>
    <h1>No connection</h1>
    <p>
      Ten Minute Handover needs the network to show today's classes — the
      data here is never cached, so it can't go stale. Reconnect and reload.
    </p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
